<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CycleCare — Mindful Women's Health & Cycle Companion</title>
  <meta name="description" content="Modern, private women's health and period-tracking app designed with soft aesthetics, holistic hormone insights, and on-device security.">
  <meta name="theme-color" content="#FFF5F7">

  <!-- PWA & Mobile Web App Capabilities -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="apple-touch-icon" href="/assets/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CycleCare">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pink: '#F472B6',
              rose: '#E11D48',
              lavender: '#A855F7',
              plum: '#2D232E',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#FFF5F7] text-[#2D232E] font-sans antialiased selection:bg-pink-200 selection:text-pink-900 min-h-screen">

  <!-- Root Mounting Container -->
  <div id="root"></div>

  <!-- Dynamic Environment Runtime -->
  <script src="/env.js"></script>

  <!-- CycleCare Master Script -->
  <script src="cyclecare.js?v=1.0.4"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.log('ServiceWorker registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
